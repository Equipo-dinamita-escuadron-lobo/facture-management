spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/factures}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: ${DB_HIBERNATE_DDL_AUTO:create-drop}

  h2:
    console:
      enabled: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:30000}
    requested-heartbeat: ${RABBITMQ_HEARTBEAT:30}
    publisher-confirm-type: correlated
    publisher-returns: true
    # Connection pool
    cache:
      connection:
        mode: connection
        size: ${RABBITMQ_CONNECTION_POOL_SIZE:5}
      channel:
        size: ${RABBITMQ_CHANNEL_POOL_SIZE:25}
        checkout-timeout: ${RABBITMQ_CHANNEL_CHECKOUT_TIMEOUT:5000}
    # Listener container
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: ${RABBITMQ_PREFETCH:10}
        concurrency: ${RABBITMQ_CONCURRENCY:1}
        max-concurrency: ${RABBITMQ_MAX_CONCURRENCY:5}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/auth/realms/oauth2-realm}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/auth/realms/oauth2-realm/protocol/openid-connect/certs}

server:
  port: ${PORT:0}

eureka:
  instance:
    instance-id: "${spring.application.name}:${random.uuid}"
    hostname: ${INSTANCE_HOSTNAME:localhost}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

logging:
  level:
    org:
      Keycloak: ${KEYCLOAK_LOG_LEVEL:DEBUG}
jwt:
  auth:
    converter:
      principle-attribute: ${JWT_PRINCIPAL_ATTR:preferred_username}
      resource-id: ${JWT_RESOURCE_ID:microservices_client}

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10

management:
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

baseUrl: ${BASE_URL:http://localhost:8080}

facture:
  security:
    service-token:
      uri: ${FACTURE_OAUTH_TOKEN_URI:${JWT_ISSUER_URI:http://localhost:8090/auth/realms/oauth2-realm}/protocol/openid-connect/token}
      client-id: ${FACTURE_OAUTH_CLIENT_ID:facture-service}
      client-secret: ${FACTURE_OAUTH_CLIENT_SECRET:}
  outbox:
    delay-ms: ${FACTURE_OUTBOX_DELAY_MS:5000}
